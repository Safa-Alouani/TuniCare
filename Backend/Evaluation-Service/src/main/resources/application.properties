spring.application.name=evaluation-service
# Port du microservice Evaluation
server.port=8088

# Firebase
firebase.project-id=evaluation-b2880
firebase.credentials.path=

# Appointment Service (Fatma - a valider selon le port reel)
services.appointment.url=http://localhost:8081

# RabbitMQ
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest

# RabbitMQ - Contrats d'echange et queues
rabbitmq.exchange.name=mediconnect.events
rabbitmq.queue.appointment-completed=evaluation.appointment.completed
rabbitmq.routing-key.appointment-completed=appointment.completed
rabbitmq.routing-key.evaluation-created=evaluation.created
